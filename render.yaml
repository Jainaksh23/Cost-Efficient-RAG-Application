services:
  - type: web
    name: cost-efficient-rag-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TOP_K
        value: "5"
      - key: MIN_SIMILARITY_THRESHOLD
        value: "0.25"
      - key: CHUNK_SIZE
        value: "2048"
      - key: CHUNK_OVERLAP
        value: "256"
